spring.application.name=hackmate

# ===== Test: H2 in-memory DB (MySQL compatibility mode) =====
spring.datasource.url=jdbc:h2:mem:hackmate;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== Do not activate the 'local' profile in tests =====
spring.profiles.active=test

# ===== JWT =====
spring.jwt.secret=this_is_a_very_secret_key_for_hackMateProject

# ===== Redis (no real connection is made during tests) =====
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===== Mail (dummy values so property placeholders resolve) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
